name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Verify legacy WEB BOQ payload
        run: npm run verify:legacy

      - name: Typecheck
        run: npm run typecheck

      - name: Build Next.js
        run: npm run build

      - name: Build Docker image
        run: docker build -t web-boq-ci .

      - name: Smoke test Docker container
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name web-boq-ci -p 3000:3000 web-boq-ci
          trap 'docker logs web-boq-ci || true; docker rm -f web-boq-ci || true' EXIT

          healthy=0
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/api/health >/tmp/web-boq-health.json; then
              healthy=1
              break
            fi
            sleep 2
          done

          if [ "$healthy" -ne 1 ]; then
            echo 'Container did not become healthy in time.' >&2
            exit 1
          fi

          cat /tmp/web-boq-health.json

          legacy=0
          for i in {1..20}; do
            if curl -fsS -D /tmp/web-boq-legacy.headers http://127.0.0.1:3000/legacy -o /tmp/web-boq-legacy.html; then
              legacy=1
              break
            fi
            sleep 2
          done

          if [ "$legacy" -ne 1 ]; then
            echo 'Legacy WEB BOQ route did not become available in time.' >&2
            exit 1
          fi

          # Exercise the real WEB BOQ route too. This fails if the runtime
          # Add Item patch cannot find/apply its target or if /legacy crashes.
          grep -Fiq 'x-web-boq-version: v15-nextjs-add-item-fix' /tmp/web-boq-legacy.headers
          grep -Fq 'WEB BOQ' /tmp/web-boq-legacy.html
