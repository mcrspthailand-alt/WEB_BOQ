name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Diagnose legacy WEB BOQ chunks
        run: node scripts/diagnose-legacy.mjs
      - name: Verify legacy WEB BOQ payload
        run: npm run verify:legacy
      - name: Typecheck
        run: npm run typecheck
      - name: Build Next.js
        run: npm run build
